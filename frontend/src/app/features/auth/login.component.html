<div class="login-page">
  <div class="login-card">
    <div class="brand">
      <span class="mark"><svg lucideFuel [size]="18"></svg></span>
      <div>
        <b>Gas Station</b>
        <small>Hệ thống quản lý trạm xăng</small>
      </div>
    </div>

    <h1>Đăng nhập</h1>
    <p class="intro">Đăng nhập để truy cập dữ liệu vận hành.</p>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <label for="username">Tên đăng nhập</label>
      <input id="username" formControlName="username" autocomplete="username" placeholder="Nhập tên đăng nhập" />

      <label for="password">Mật khẩu</label>
      <input id="password" type="password" formControlName="password" autocomplete="current-password" placeholder="Nhập mật khẩu" />

      @if (message()) {
        <div class="form-message" [class.error]="isError()">{{ message() }}</div>
      }

      <button type="submit" class="btn btn-primary" [disabled]="form.invalid || submitting()">
        {{ submitting() ? 'Đang đăng nhập…' : 'Đăng nhập' }}
      </button>
    </form>

    <small class="note">Phiên đăng nhập và cookie được quản lý an toàn tại backend.</small>
  </div>
</div>
